name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        uses: tgymnich/fork-sync@v2
        with:
          owner: elder-plinius
          base: main
          head: main
          auto_approve: true
          token: ${{ secrets.GITHUB_TOKEN }}
